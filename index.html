button{cursor:pointer;color:var(--ac)}button:hover,button:focus-visible{border-color:var(--ac);outline:0}
textarea{width:100%;min-height:70px}

.w{max-width:900px;margin:0 auto;padding:14px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.blk{margin-bottom:10px;padding:8px}

.mu{color:var(--mu);font-size:12px;word-break:break-all}

.ed{display:grid;grid-template-columns:150px 1fr 270px;gap:10px;padding:10px}
.side{display:flex;flex-direction:column;gap:8px;align-content:start}
.tx{min-height:40px;border:1px dashed var(--bd);padding:6px}
.bh button{padding:2px 8px}
.pri,.on{background:var(--ac);color:#000}

.bar{padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--pn)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);padding:8px 14px;z-index:99}
.rl input{flex:1;min-width:120px}
@media(max-width:800px){.ed{grid-template-columns:1fr}}
