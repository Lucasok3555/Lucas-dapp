<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucas DApp</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Mono&family=Orbitron&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--pn:#0e131a;--bd:#1d2a36;--ac:#00ff9c;--tx:#cfe;--mu:#6a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px 'Share Tech Mono',monospace}
button,input,select,textarea{font:inherit;background:var(--pn);color:var(--tx);border:1px solid var(--bd);padding:7px 10px;border-radius:4px;max-width:100%}
button{cursor:pointer;color:var(--ac)}button:hover,button:focus-visible{border-color:var(--ac);outline:0}
textarea{width:100%;min-height:70px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{margin:0;font:20px Orbitron,monospace;color:var(--ac);flex:1;cursor:pointer}
.w{max-width:900px;margin:0 auto;padding:14px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card,.blk{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.blk{margin-bottom:10px;padding:8px}
.logo{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#000;border:1px solid var(--bd);flex:none}
.ph{display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:24px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover}
.mu{color:var(--mu);font-size:12px;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:150px 1fr 270px;gap:10px;padding:10px}
.side{display:flex;flex-direction:column;gap:8px;align-content:start}
.tx{min-height:40px;border:1px dashed var(--bd);padding:6px}
.bh button{padding:2px 8px}
.pri,.on{background:var(--ac);color:#000}
#full{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;overflow:auto}
.bar{padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--pn)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);padding:8px 14px;z-index:99}
@media(max-width:800px){.ed{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="full"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k==='on')for(const x in v)e.addEventListener(x,v[x]);else if(k==='style'||!(k in e))e.setAttribute(k,v);else e[k]=v}c.flat(9).forEach(x=>x!=null&&x!==false&&e.append(x));return e};
/* ===== cripto: sha256, secp256k1 (BIP340), bech32 ===== */
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join(''),unhex=s=>Uint8Array.from(s.match(/../g)||[],x=>parseInt(x,16));
const sha=async b=>new Uint8Array(await crypto.subtle.digest('SHA-256',b));
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const big=b=>BigInt('0x'+hex(b)),b32=n=>unhex(n.toString(16).padStart(64,'0'));
const P=2n**256n-2n**32n-977n,N=0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n,
G=[0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n,0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n];
const md=a=>((a%P)+P)%P;
const inv=a=>{let[r0,r1,s0,s1]=[P,md(a),0n,1n];while(r1){const q=r0/r1;[r0,r1,s0,s1]=[r1,r0-q*r1,s1,s0-q*s1]}return md(s0)};
const add=(A,B)=>{if(!A)return B;if(!B)return A;const[x1,y1]=A,[x2,y2]=B;let l;if(x1===x2){if(md(y1+y2)===0n)return null;l=md(3n*x1*x1*inv(2n*y1))}else l=md((y2-y1)*inv(x2-x1));const x=md(l*l-x1-x2);return[x,md(l*(x1-x)-y1)]};
const mul=(k,A)=>{let r=null;while(k>0n){if(k&1n)r=add(r,A);A=add(A,A);k>>=1n}return r};
const th=async(t,...m)=>{const x=await sha(new TextEncoder().encode(t));return sha(cat(x,x,...m))};
const pub=sk=>hex(b32(mul(big(sk),G)[0]));
const sign=async(sk,msg)=>{let d=big(sk);const Q=mul(d,G);if(Q[1]&1n)d=N-d;const px=b32(Q[0]),a=await th('BIP0340/aux',crypto.getRandomValues(new Uint8Array(32))),t=b32(d).map((x,i)=>x^a[i]);let k=big(await th('BIP0340/nonce',t,px,msg))%N;const R=mul(k,G);if(R[1]&1n)k=N-k;const rx=b32(R[0]),e=big(await th('BIP0340/challenge',rx,px,msg))%N;return cat(rx,b32((k+e*d)%N))};
const CH='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
const pm=v=>{let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3].forEach((g,i)=>{if((b>>i)&1)c^=g})}return c};
const he=p=>[...p].map(c=>c.charCodeAt(0)>>5).concat(0,[...p].map(c=>c.charCodeAt(0)&31));
const cb=(d,f,t,pad)=>{let a=0,b=0;const o=[],m=(1<<t)-1;for(const v of d){a=((a<<f)|v)&((1<<(f+t))-1);b+=f;while(b>=t){b-=t;o.push((a>>b)&m)}}if(pad&&b)o.push((a<<(t-b))&m);return o};
const enc=(p,by)=>{const d=cb(by,8,5,1),x=pm(he(p).concat(d,[0,0,0,0,0,0]))^1;return p+'1'+d.concat([0,1,2,3,4,5].map(i=>(x>>5*(5-i))&31)).map(v=>CH[v]).join('')};
const dec=s=>Uint8Array.from(cb([...s.slice(s.lastIndexOf('1')+1)].map(c=>CH.indexOf(c)).slice(0,-6),5,8,0));
const keyFrom=s=>{s=s.trim();if(/^nsec1/i.test(s))return dec(s.toLowerCase());if(/^[0-9a-f]{64}$/i.test(s))return unhex(s.toLowerCase());throw 0};
/* ===== Nostr: relays, eventos ===== */
const RL=['wss://nos.lol','wss://relay.damus.io','wss://bitcoiner.social'];
const S={sk:null,pk:null,prof:{},apps:[],cur:null,pg:0,v:'home',ld:0};
const mk=async(kind,tags,content)=>{const e={pubkey:S.pk,created_at:Math.floor(Date.now()/1e3),kind,tags,content};e.id=hex(await sha(new TextEncoder().encode(JSON.stringify([0,e.pubkey,e.created_at,kind,tags,content]))));e.sig=hex(await sign(S.sk,unhex(e.id)));return e};
const conn=u=>new Promise(r=>{try{const w=new WebSocket(u);w.onopen=()=>r(w);w.onerror=()=>r(null);setTimeout(()=>r(null),4e3)}catch{r(null)}});
const query=async f=>{const out=[];await Promise.all(RL.map(async u=>{const w=await conn(u);if(!w)return;await new Promise(r=>{w.onmessage=m=>{const d=JSON.parse(m.data);if(d[0]==='EVENT')out.push(d[2]);if(d[0]==='EOSE')r()};w.onclose=r;w.send(JSON.stringify(['REQ','q',f]));setTimeout(r,5e3)});w.close()}));return out};
const publish=async ev=>{let ok=0;await Promise.all(RL.map(async u=>{const w=await conn(u);if(!w)return;await new Promise(r=>{w.onmessage=m=>{const d=JSON.parse(m.data);if(d[0]==='OK'){if(d[2])ok++;r()}};w.send(JSON.stringify(['EVENT',ev]));setTimeout(r,4e3)});w.close()}));return ok};
/* ===== utilitários ===== */
const toast=t=>{const d=h('div',{class:'toast'},t);document.body.append(d);setTimeout(()=>d.remove(),3000)};
const su=u=>/^https?:\/\//i.test(u||'')?u:'';
const rid=()=>'ldapp-'+Math.random().toString(36).slice(2,10);
const FONTS=['inherit','Share Tech Mono','Space Mono','Orbitron','Georgia','Arial'];
const ts=b=>`font-size:${+b.size||16}px;text-align:${['left','center','right'].includes(b.align)?b.align:'left'};font-family:${FONTS.includes(b.font)&&b.font!=='inherit'?`'${b.font}'`:'inherit'}`;
const san=s=>{const d=new DOMParser().parseFromString(s||'','text/html');d.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*(javascript|data):/i.test(a.value))e.removeAttribute(a.name)}));return d.body.innerHTML};
const txt=p=>(p.name+' '+p.blocks.filter(b=>b.t==='text').map(b=>new DOMParser().parseFromString(san(b.html),'text/html').body.textContent).join(' ')).toLowerCase();
const inp=(o,k,ph)=>h('input',{value:o[k]||'',placeholder:ph,on:{input:e=>o[k]=e.target.value}});
const ta=(o,k,ph)=>h('textarea',{placeholder:ph,value:o[k]||'',on:{input:e=>o[k]=e.target.value}});
/* ===== dados ===== */
async function load(){S.ld=1;const ev=await query({kinds:[30078],'#t':['lucasdapp'],limit:300}),m={};
for(const e of ev){const d=(e.tags.find(t=>t[0]==='d')||[])[1];if(!d)continue;const k=e.pubkey+':'+d;if(!m[k]||m[k].created_at<e.created_at)m[k]=e}
S.apps=Object.values(m).map(e=>{try{const a=JSON.parse(e.content);if(!Array.isArray(a.pages)||!a.pages.length)return null;a.id=e.tags.find(t=>t[0]==='d')[1];a.pk=e.pubkey;return a}catch{return null}}).filter(Boolean).sort((a,b)=>(b.created||'').localeCompare(a.created||''));
S.ld=2;if(S.v==='home'||S.v==='painel')render()}
async function prof(){const e=(await query({kinds:[0],authors:[S.pk],limit:3})).sort((a,b)=>b.created_at-a.created_at)[0];try{S.prof=JSON.parse(e.content)}catch{}if(S.v!=='edit')render()}
function login(sk){S.sk=sk;S.pk=pub(sk);localStorage.setItem('ldapp_sk',hex(sk));prof()}
async function newAcc(n){if(!n.trim())return toast('Digite um nome');const sk=crypto.getRandomValues(new Uint8Array(32));login(sk);S.prof={name:n.trim()};await publish(await mk(0,[],JSON.stringify({name:n.trim()})));prompt('Guarde sua chave secreta (nsec). Copie agora:',enc('nsec',sk));go('painel')}
async function save(){const a=S.cur;toast('Salvando…');const n=await publish(await mk(30078,[['d',a.id],['t','lucasdapp'],['alt','Lucas DApp: '+a.name]],JSON.stringify({name:a.name,logo:a.logo,created:a.created,pages:a.pages})));if(n){const k=S.apps.findIndex(x=>x.id===a.id&&x.pk===a.pk),c=structuredClone(a);k<0?S.apps.unshift(c):S.apps[k]=c}toast(n?'Salvo em '+n+' relay(s)':'Falha ao salvar')}
async function del(a){if(!confirm('Apagar "'+a.name+'"?'))return;await publish(await mk(30078,[['d',a.id],['t','lucasdapp']],'{"deleted":true}'));await publish(await mk(5,[['a','30078:'+a.pk+':'+a.id]],'apagado'));S.apps=S.apps.filter(x=>x!==a);render()}
/* ===== telas ===== */
const go=v=>{S.v=v;render()};
const render=()=>$('#app').replaceChildren(h('header',{},h('h1',{on:{click:()=>go('home')}},'Lucas DApp'),
S.pk?h('span',{class:'row'},su(S.prof.picture)?h('img',{class:'av',src:S.prof.picture}):'',S.prof.name||enc('npub',unhex(S.pk)).slice(0,12)+'…'):h('button',{on:{click:()=>go('login')}},'Entrar'),
h('button',{on:{click:()=>go('painel')}},'Painel')),({home:vHome,login:vLogin,painel:vPainel,edit:vEdit})[S.v]());
const logo=a=>su(a.logo)?h('img',{class:'logo',src:a.logo}):h('div',{class:'logo ph'},(a.name||'?')[0]);
const card=(a,own)=>h('div',{class:'card'},h('div',{class:'row'},logo(a),h('div',{},h('b',{},a.name||'Sem nome'),h('div',{class:'mu'},'ID: '+a.id))),
h('div',{class:'row'},h('button',{on:{click:()=>run(a)}},'Abrir'),own?[h('button',{on:{click:()=>edit(a)}},'Editar'),h('button',{on:{click:()=>del(a)}},'Apagar')]:''));
const vHome=()=>h('div',{class:'w'},h('h2',{},'Aplicativos'),S.apps.length?h('div',{class:'grid'},S.apps.map(a=>card(a))):h('p',{class:'mu'},S.ld===2?'Nenhum app encontrado nos relays.':'Carregando apps dos relays…'));
function vLogin(){const k=h('input',{type:'password',placeholder:'nsec1… ou chave hex'}),n=h('input',{placeholder:'Nome da conta nova'});
return h('div',{class:'w'},h('h2',{},'Entrar com chave Nostr'),h('div',{class:'row'},k,h('button',{on:{click:()=>{try{login(keyFrom(k.value));go('painel')}catch{toast('Chave inválida')}}}},'Entrar')),
h('h2',{},'Nova conta'),h('div',{class:'row'},n,h('button',{on:{click:()=>newAcc(n.value)}},'Criar conta nova')))}
function vPainel(){if(!S.pk)return vLogin();const mine=S.apps.filter(a=>a.pk===S.pk);
return h('div',{class:'w'},h('div',{class:'row'},h('h2',{style:'flex:1'},'Meus apps'),h('button',{on:{click:()=>edit(null)}},'+ Novo app'),h('button',{on:{click:()=>{localStorage.removeItem('ldapp_sk');S.sk=S.pk=null;S.prof={};go('home')}}},'Sair')),
mine.length?h('div',{class:'grid'},mine.map(a=>card(a,1))):h('p',{class:'mu'},'Você ainda não criou apps.'))}
function edit(a){if(!S.pk)return go('login');S.cur=a?structuredClone(a):{id:rid(),pk:S.pk,name:'Novo app',logo:'',created:new Date().toISOString(),pages:[{name:'Início',blocks:[]}]};S.pg=0;go('edit')}
const nb=t=>({text:{t,html:'Escreva aqui',size:16,align:'left',font:'inherit'},media:{t,url:''},code:{t,html:'',css:'',js:''},wallet:{t,addr:''},search:{t}})[t];
function vEdit(){const a=S.cur,pg=a.pages[S.pg];
return h('div',{class:'ed'},
h('div',{class:'side'},h('b',{},'Blocos'),[['text','Texto'],['media','Mídia'],['code','Código'],['wallet','Carteira cripto'],['search','Busca']].map(([t,l])=>h('button',{on:{click:()=>{pg.blocks.push(nb(t));render()}}},'+ '+l))),
h('div',{},h('div',{class:'mu'},'Editando: '+pg.name),pg.blocks.map((b,i)=>eb(b,i,pg.blocks))),
h('div',{class:'side'},h('b',{},'App'),inp(a,'name','Nome do app'),inp(a,'logo','URL da logo'),h('div',{class:'mu'},'ID: '+a.id),h('div',{class:'mu'},'Criado: '+new Date(a.created).toLocaleString('pt-BR')),
h('b',{},'Páginas'),a.pages.map((p,i)=>h('div',{class:'row'},(i+1)+'.',inp(p,'name','Nome'),h('button',{on:{click:()=>{S.pg=i;render()}}},'editar'),h('button',{on:{click:()=>{if(a.pages.length<2)return toast('Mantenha ao menos 1 página');a.pages.splice(i,1);S.pg=0;render()}}},'apagar'))),
h('button',{on:{click:()=>{a.pages.push({name:'Página '+(a.pages.length+1),blocks:[]});S.pg=a.pages.length-1;render()}}},'+ Página'),
h('button',{class:'pri',on:{click:save}},'Salvar'),h('button',{on:{click:()=>{go('painel');load()}}},'Voltar')))}
function eb(b,i,arr){const mv=d=>h('button',{on:{click:()=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];render()}}},d<0?'↑':'↓');
const bar=h('div',{class:'row bh'},h('span',{class:'mu',style:'flex:1'},b.t),mv(-1),mv(1),h('button',{on:{click:()=>{arr.splice(i,1);render()}}},'✕'));let body;
if(b.t==='text'){let rg;const el=h('div',{class:'tx',contentEditable:'true',style:ts(b),on:{input:()=>b.html=el.innerHTML,blur:()=>{const s=getSelection();rg=s.rangeCount?s.getRangeAt(0):null}}});el.innerHTML=san(b.html);
const st=()=>el.setAttribute('style',ts(b)),bt=(l,f)=>h('button',{on:{mousedown:e=>{e.preventDefault();f()}}},l),
fmt=(c,v)=>{if(document.activeElement!==el){el.focus();if(rg){const s=getSelection();s.removeAllRanges();s.addRange(rg)}}document.execCommand(c,false,v);b.html=el.innerHTML};
body=[h('div',{class:'row'},bt('A+',()=>{b.size=(+b.size||16)+2;st()}),bt('A-',()=>{b.size=Math.max(8,(+b.size||16)-2);st()}),h('input',{type:'color',value:'#ccffee',on:{input:e=>fmt('foreColor',e.target.value)}}),
bt('⇤',()=>{b.align='left';st()}),bt('↔',()=>{b.align='center';st()}),bt('⇥',()=>{b.align='right';st()}),bt('🔗',()=>{const u=prompt('URL do link (https://…)');if(su(u))fmt('createLink',u)}),
h('select',{on:{change:e=>{b.font=e.target.value;st()}}},FONTS.map(f=>h('option',{value:f,selected:f===b.font},f)))),el]}
else if(b.t==='media')body=inp(b,'url','Link de imagem, áudio ou vídeo (https://…)');
else if(b.t==='code')body=[ta(b,'html','HTML'),ta(b,'css','CSS'),ta(b,'js','JavaScript')];
else if(b.t==='wallet')body=inp(b,'addr','Endereço da carteira para doações');
else body=h('div',{class:'mu'},'Barra de pesquisa: busca em todas as páginas do app.');
return h('div',{class:'blk'},bar,body)}
/* ===== execução do app (tela cheia) ===== */
function bv(b,a,gp){
if(b.t==='text'){const d=h('div',{style:ts(b)});d.innerHTML=san(b.html);d.querySelectorAll('a').forEach(x=>{x.target='_blank';x.rel='noopener noreferrer'});return d}
if(b.t==='media'){const u=su(b.url);if(!u)return h('div');const x=u.split(/[?#]/)[0].toLowerCase();return /\.(mp3|ogg|wav|m4a|flac|opus)$/.test(x)?h('audio',{src:u,controls:true}):/\.(mp4|webm|mov|m4v)$/.test(x)?h('video',{src:u,controls:true,style:'max-width:100%'}):h('img',{src:u,style:'max-width:100%'})}
if(b.t==='code')return h('iframe',{sandbox:'allow-scripts',srcdoc:`<style>${b.css||''}</style>${b.html||''}<script>${b.js||''}<\/script>`,style:'width:100%;height:320px;border:1px solid #1d2a36;background:#fff'});
if(b.t==='wallet')return h('div',{class:'blk'},'Doação: ',h('code',{},b.addr||''),h('button',{on:{click:()=>navigator.clipboard.writeText(b.addr||'').then(()=>toast('Endereço copiado'))}},'Copiar'));
if(b.t==='search'){const o=h('div'),i=h('input',{placeholder:'Pesquisar nas páginas…',on:{input:()=>{const q=i.value.toLowerCase().trim();o.replaceChildren(...(q?a.pages.map((p,n)=>[p,n]).filter(([p])=>txt(p).includes(q)).map(([p,n])=>h('div',{},h('button',{on:{click:()=>gp(n)}},(n+1)+'. '+p.name))):[]))}}});return h('div',{},i,o)}
return h('div')}
function run(a,n=0){const f=$('#full'),gp=m=>run(a,m);f.style.display='flex';
f.replaceChildren(h('div',{class:'row bar'},h('b',{style:'flex:1'},a.name),a.pages.length>1?a.pages.map((p,i)=>h('button',{class:i===n?'on':'',on:{click:()=>gp(i)}},p.name)):'',h('button',{on:{click:()=>{f.style.display='none';f.replaceChildren()}}},'Fechar')),
h('div',{class:'w'},a.pages[n].blocks.map(b=>bv(b,a,gp))))}
/* ===== início ===== */
(()=>{const k=localStorage.getItem('ldapp_sk');if(k){try{S.sk=unhex(k);S.pk=pub(S.sk);prof()}catch{S.sk=S.pk=null}}render();load()})();
</script></body></html>
